<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title">Etch-a-Sketch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div class="logo">Etch-a-Sketch</div>
    </div>

    <div class="main">
        <!-- grid squares -->
        <div class="container"></div>

        <!-- button -->
        <div class="button-container">
            <button class="gridSize">Grid Size</button>
            <button class="randomColor">Random Color</button>
            <button class="black">Black Ink</button>
            <button class="clickDrag">Click & Drag</button>
            <button class="reset">Reset</button>
        </div>


    </div>
    <!-- footer -->
    <div class="footer">Copyright @ Etch-a-Sketch 2026</div>

    <script src="script.js"></script>
</body>
</html>
